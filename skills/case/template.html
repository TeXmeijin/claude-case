<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Case</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1b2230;
    --border: #262d38;
    --border-strong: #323a47;
    --text: #e6edf3;
    --muted: #8b949e;
    --muted-2: #6e7681;
    --accent: #7c9cff;
    --accent-soft: rgba(124,156,255,.14);
    --rec-fg: #c2a34a;
    --rec-bg: rgba(194,163,74,.09);
    --ok: #3fb950;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Hiragino Sans", system-ui, sans-serif; }
  body { padding: 28px 20px 160px; line-height: 1.55; }
  .wrap { max-width: 820px; margin: 0 auto; }

  header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 10px var(--accent); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  header .tag { color: var(--muted-2); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  header .kb { color: var(--muted); font-size: 11px; margin-left: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  .intro { color: var(--muted); font-size: 13px; margin: 0 0 22px; white-space: pre-wrap; }

  .q {
    position: relative;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 18px 14px; margin-bottom: 14px;
    transition: border-color .12s ease, background .12s ease;
  }
  .q::before {
    content: ""; position: absolute; left: -1px; top: 14px; bottom: 14px; width: 2px;
    background: transparent; border-radius: 2px; transition: background .12s ease;
  }
  .q.active { border-color: var(--border-strong); }
  .q.active::before { background: var(--accent); }

  .q .head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .q .num { color: var(--muted-2); font-variant-numeric: tabular-nums; font-size: 11px;
    letter-spacing: .12em; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .q h2 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .01em; }

  .q .reason { color: var(--muted); font-size: 12.5px; margin: 2px 0 12px; }

  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
  .opt {
    position: relative; cursor: pointer; overflow: hidden;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 40px 10px 32px;
    transition: all .1s ease; user-select: none;
    display: flex; flex-direction: column; gap: 3px; min-height: 56px;
  }
  .opt::before {
    content: ""; position: absolute; left: 10px; top: 12px;
    width: 14px; height: 14px; border-radius: 50%;
    border: 1.5px solid var(--border-strong); background: transparent;
    transition: all .1s ease;
  }
  .opt:hover { border-color: var(--border-strong); background: #1f2631; }
  .opt .key {
    position: absolute; top: 8px; right: 10px; font-size: 10.5px; color: var(--muted-2);
    border: 1px solid var(--border-strong); border-radius: 5px; padding: 0 5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .opt .label {
    font-weight: 600; font-size: 13.5px;
    display: flex; flex-wrap: wrap; align-items: center;
    column-gap: 6px; row-gap: 4px;
    min-width: 0; overflow-wrap: anywhere;
  }
  .opt .note { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .opt .rec-badge {
    font-size: 10px; font-weight: 500; letter-spacing: .05em;
    background: var(--rec-bg); color: var(--rec-fg);
    padding: 1px 6px; border-radius: 999px; border: 1px solid transparent;
    flex-shrink: 0; white-space: nowrap; align-self: flex-start;
  }

  .opt.selected { background: var(--accent-soft); border-color: var(--accent); }
  .opt.selected::before {
    background: var(--accent); border-color: var(--accent);
    box-shadow: inset 0 0 0 3px var(--panel);
  }
  .opt.selected .label { color: var(--text); }

  .free-wrap { margin-top: 10px; }
  .free-wrap label {
    display: block; font-size: 11px; color: var(--muted-2); margin-bottom: 4px;
    letter-spacing: .08em; text-transform: uppercase;
  }
  textarea, input.free {
    width: 100%; resize: vertical; min-height: 38px;
    background: #0b0f15; color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 13px;
    outline: none;
  }
  textarea { min-height: 54px; }
  textarea:focus, input.free:focus { border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(124,156,255,.18); }

  .notes {
    border: 1px dashed var(--border-strong); background: transparent;
    border-radius: var(--radius); padding: 14px 18px; margin-top: 18px;
  }
  .notes .head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .notes h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
  .notes .num { color: var(--muted-2); font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; }

  footer.bar {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 20px 16px;
    background: linear-gradient(0deg, rgba(14,17,22,.98) 60%, rgba(14,17,22,0));
    backdrop-filter: blur(6px);
  }
  footer.bar .inner { max-width: 820px; margin: 0 auto;
    display: flex; gap: 10px; align-items: center; justify-content: flex-end; }
  .status { margin-right: auto; color: var(--muted); font-size: 12px; }
  .status b { color: var(--text); font-weight: 600; }
  button {
    background: var(--accent); color: #0a0c12; border: 0; border-radius: 8px;
    padding: 9px 16px; font: inherit; font-weight: 700; font-size: 12.5px;
    cursor: pointer; letter-spacing: .02em;
    transition: transform .08s ease, filter .12s ease, opacity .12s ease;
  }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--border-strong); }
  button.ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button .kbd { opacity: .65; margin-left: 8px; font-size: 10.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  .done {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.55); z-index: 50;
  }
  .done.show { display: flex; }
  .done .card {
    background: var(--panel); border: 1px solid var(--border-strong);
    border-radius: var(--radius); padding: 28px 28px 22px; max-width: 440px; text-align: center;
  }
  .done .mark { font-size: 32px; color: var(--ok); margin-bottom: 6px; }
  .done h3 { margin: 0 0 4px; font-size: 15px; }
  .done p { margin: 0; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="dot"></div>
    <h1 id="hdr-title">Case</h1>
    <span class="tag" id="hdr-tag">agent input</span>
    <span class="kb">↑↓ / j k — move · 1–9 — pick · A — accept all · ⌘⏎ — submit</span>
  </header>
  <p class="intro" id="intro"></p>

  <div id="questions"></div>

  <div class="notes">
    <div class="head"><span class="num">NOTES</span><h2>Additional context for the agent</h2></div>
    <textarea id="notes" placeholder="Overall remarks, scope changes, or side discussions"></textarea>
  </div>
</div>

<footer class="bar">
  <div class="inner">
    <div class="status" id="status">0 / 0 answered</div>
    <button class="ghost" id="btn-all">Accept all recommendations <span class="kbd">A</span></button>
    <button id="btn-submit" disabled>Submit <span class="kbd">⌘⏎</span></button>
  </div>
</footer>

<div class="done" id="done">
  <div class="card">
    <div class="mark">✓</div>
    <h3>Answer sent</h3>
    <p>You can close this tab and return to the agent.</p>
  </div>
</div>

<script id="decide-data" type="application/json">__DECIDE_DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById('decide-data').textContent);
document.title = DATA.title ? `Case — ${DATA.title}` : 'Case';
if (DATA.title) document.getElementById('hdr-title').textContent = DATA.title;
if (DATA.tag) document.getElementById('hdr-tag').textContent = DATA.tag;
if (DATA.intro) document.getElementById('intro').textContent = DATA.intro;
else document.getElementById('intro').remove();

const qRoot = document.getElementById('questions');
const state = DATA.questions.map(q => ({ id: q.id, selected: null, free: "" }));
let activeIdx = 0;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render() {
  qRoot.innerHTML = DATA.questions.map((q, i) => `
    <div class="q ${i === 0 ? 'active' : ''}" data-i="${i}" id="q-${i}" tabindex="-1">
      <div class="head">
        <span class="num">Q${i+1}</span>
        <h2>${escapeHtml(q.title)}</h2>
      </div>
      ${q.reason ? `<div class="reason">${escapeHtml(q.reason)}</div>` : ''}
      <div class="opts">
        ${q.options.map((o, oi) => `
          <div class="opt" data-idx="${oi}" data-q="${i}">
            <span class="key">${oi+1}</span>
            <span class="label">
              ${escapeHtml(o.label)}
              ${o.recommended ? '<span class="rec-badge">recommended</span>' : ''}
            </span>
            ${o.note ? `<span class="note">${escapeHtml(o.note)}</span>` : ''}
          </div>
        `).join('')}
      </div>
      ${q.allowFreeText !== false ? `
        <div class="free-wrap">
          <label for="free-${i}">Free word</label>
          <input class="free" id="free-${i}" data-q="${i}" placeholder="Optional caveat, counter-proposal, or condition" />
        </div>
      ` : ''}
    </div>
  `).join('');

  qRoot.querySelectorAll('.opt').forEach(el => {
    el.addEventListener('click', () => {
      const qi = parseInt(el.dataset.q);
      const oi = parseInt(el.dataset.idx);
      focusQuestion(qi);
      select(qi, oi);
    });
  });
  qRoot.querySelectorAll('input.free').forEach(el => {
    el.addEventListener('focus', () => focusQuestion(parseInt(el.dataset.q)));
    el.addEventListener('input', () => {
      state[parseInt(el.dataset.q)].free = el.value;
      updateStatus();
    });
  });
  qRoot.querySelectorAll('.q').forEach(el => {
    el.addEventListener('mouseenter', () => focusQuestion(parseInt(el.dataset.i), false));
  });
}

function select(qi, oi) {
  state[qi].selected = oi;
  const q = document.getElementById(`q-${qi}`);
  q.querySelectorAll('.opt').forEach(el => el.classList.remove('selected'));
  q.querySelector(`.opt[data-idx="${oi}"]`).classList.add('selected');
  updateStatus();
}

function focusQuestion(i, scroll = true) {
  if (i < 0) i = 0;
  if (i >= DATA.questions.length) i = DATA.questions.length - 1;
  activeIdx = i;
  qRoot.querySelectorAll('.q').forEach(el => el.classList.remove('active'));
  const el = document.getElementById(`q-${i}`);
  el.classList.add('active');
  if (scroll) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function acceptAllRecommended() {
  DATA.questions.forEach((q, i) => {
    const recIdx = q.options.findIndex(o => o.recommended);
    if (recIdx >= 0) select(i, recIdx);
  });
}

function allAnswered() {
  return state.every(isAnswered);
}

function isAnswered(s) {
  return s.selected !== null || s.free.trim() !== "";
}

function updateStatus() {
  const done = state.filter(isAnswered).length;
  const total = state.length;
  document.getElementById('status').innerHTML =
    `<b>${done}</b> / ${total} answered` +
    (done < total ? ` · ${total - done} left` : ' · ready');
  document.getElementById('btn-submit').disabled = !allAnswered();
}

function buildResult() {
  return {
    version: 1,
    answers: DATA.questions.map((q, i) => ({
      id: q.id,
      title: q.title,
      selectedIndex: state[i].selected,
      selectedLabel: state[i].selected !== null ? q.options[state[i].selected].label : null,
      wasRecommended: state[i].selected !== null && !!q.options[state[i].selected].recommended,
      freeText: state[i].free || null,
    })),
    notes: document.getElementById('notes').value || null,
    submittedAt: new Date().toISOString(),
  };
}

async function submit() {
  if (!allAnswered()) return;
  const r = buildResult();
  try {
    await fetch('/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(r),
    });
  } catch (e) { /* offline/file mode: ignore */ }
  document.getElementById('done').classList.add('show');
  document.getElementById('btn-submit').disabled = true;
}

document.getElementById('btn-submit').addEventListener('click', submit);
document.getElementById('btn-all').addEventListener('click', acceptAllRecommended);
document.getElementById('notes').addEventListener('focus', () => {
  qRoot.querySelectorAll('.q').forEach(el => el.classList.remove('active'));
});

document.addEventListener('keydown', (e) => {
  const inField = e.target.matches('input, textarea');
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); submit(); return; }
  if (inField) return;

  if (e.key === 'a' || e.key === 'A') { e.preventDefault(); acceptAllRecommended(); return; }
  if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); focusQuestion(activeIdx + 1); return; }
  if (e.key === 'ArrowUp'   || e.key === 'k') { e.preventDefault(); focusQuestion(activeIdx - 1); return; }
  const n = parseInt(e.key);
  if (!isNaN(n) && n >= 1 && n <= 9) {
    const max = DATA.questions[activeIdx].options.length;
    if (n <= max) { e.preventDefault(); select(activeIdx, n - 1); }
  }
});

render();
updateStatus();
focusQuestion(0, false);
</script>
</body>
</html>
